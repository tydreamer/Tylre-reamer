<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Delivery</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FoodDelivery.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="blazor-load-screen">
            <div class="load-content">
                <p class="load-brand-name">Food Delivery</p>
                <svg class="loading-progress" viewBox="0 0 100 100" aria-hidden="true">
                    <defs>
                        <linearGradient id="blazor-progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ea580c" />
                            <stop offset="50%" stop-color="#fb923c" />
                            <stop offset="100%" stop-color="#fdba74" />
                        </linearGradient>
                    </defs>
                    <circle r="40%" cx="50%" cy="50%" pathLength="100" />
                    <circle r="40%" cx="50%" cy="50%" pathLength="100" />
                </svg>
                <div class="loading-progress-text" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.cartSync = {
            register: function (dotNetRef) {
                window.addEventListener('storage', function (e) {
                    if (e.key === 'cart') {
                        dotNetRef.invokeMethodAsync('OnCartChangedExternally');
                    }
                });
            }
        };
    </script>
</body>

</html>
