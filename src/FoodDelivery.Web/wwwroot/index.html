<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Delivery</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FoodDelivery.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app-loader" class="blazor-load-screen" aria-live="polite" aria-busy="true">
        <div class="load-content">
            <p class="load-brand-name">Food Delivery</p>
            <svg class="loading-progress" viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                    <linearGradient id="blazor-progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ea580c" />
                        <stop offset="50%" stop-color="#fb923c" />
                        <stop offset="100%" stop-color="#fdba74" />
                    </linearGradient>
                </defs>
                <circle r="40%" cx="50%" cy="50%" pathLength="100" />
                <circle r="40%" cx="50%" cy="50%" pathLength="100" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (function () {
            const root = document.documentElement;
            const loader = document.getElementById('app-loader');
            const holdCompleteMs = 150;
            const fadeOutMs = 250;

            let displayed = 0;
            let target = 0;
            let animating = false;
            let finishStarted = false;

            function readTarget() {
                const raw = getComputedStyle(root).getPropertyValue('--blazor-load-percentage').trim();
                const value = parseFloat(raw);
                return Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : 0;
            }

            function applyVisual() {
                root.style.setProperty('--blazor-load-ring', displayed.toFixed(2));
                const label = displayed >= 99.5 ? 100 : Math.round(displayed);
                root.style.setProperty('--blazor-load-display-text', `"${label}%"`);
            }

            function dismissLoader() {
                if (!loader || finishStarted) return;
                finishStarted = true;

                displayed = 100;
                applyVisual();
                loader.classList.add('is-complete');
                loader.setAttribute('aria-busy', 'false');

                setTimeout(function () {
                    loader.classList.add('is-hiding');
                    setTimeout(function () {
                        loader.classList.add('is-hidden');
                        loader.setAttribute('aria-hidden', 'true');
                    }, fadeOutMs);
                }, holdCompleteMs);
            }

            function maybeDismiss() {
                if (finishStarted || target < 100 || displayed < 99.5) return;
                dismissLoader();
            }

            function frame() {
                const delta = target - displayed;
                if (target >= 100 || Math.abs(delta) < 0.25) {
                    displayed = target;
                } else {
                    displayed += delta * 0.14;
                }

                applyVisual();
                maybeDismiss();

                if (Math.abs(target - displayed) > 0.25) {
                    requestAnimationFrame(frame);
                } else {
                    animating = false;
                    if (target >= 100) {
                        displayed = 100;
                        applyVisual();
                        maybeDismiss();
                    }
                }
            }

            function schedule() {
                target = readTarget();
                if (!animating) {
                    animating = true;
                    requestAnimationFrame(frame);
                }
            }

            const observer = new MutationObserver(schedule);
            observer.observe(root, { attributes: true, attributeFilter: ['style'] });
            applyVisual();
            schedule();
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.foodDelivery = {
            scrollToTop: function () {
                var smooth = { block: "start", inline: "nearest", behavior: "smooth" };
                var pageStart = document.querySelector("main .content h1") || document.querySelector("main .content");

                if (pageStart && pageStart.scrollIntoView) {
                    pageStart.scrollIntoView(smooth);
                    return;
                }

                window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
            },
            waitForImages: function (root) {
                if (!root || !root.querySelectorAll) {
                    return Promise.resolve();
                }

                var images = root.querySelectorAll("img");
                if (!images.length) {
                    return Promise.resolve();
                }

                var timeoutMs = 3000;
                var waits = Array.prototype.map.call(images, function (img) {
                    if (img.complete && img.naturalWidth > 0) {
                        return Promise.resolve();
                    }

                    return new Promise(function (resolve) {
                        var done = false;
                        var finish = function () {
                            if (done) return;
                            done = true;
                            resolve();
                        };

                        img.addEventListener("load", finish, { once: true });
                        img.addEventListener("error", finish, { once: true });
                        window.setTimeout(finish, timeoutMs);
                    });
                });

                return Promise.all(waits);
            }
        };
    </script>
    <script>
        window.textSelection = {
            hasTextSelection: function () {
                const sel = window.getSelection();
                return !!(sel && sel.toString().trim().length > 0);
            }
        };
    </script>
</body>

</html>
